name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]
 

jobs:
  doker-build-scout-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Build Docker Image
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest

     # 3. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 4. Scan locally with Docker Scout and FAIL on critical/high
      - name: Scan for CVEs with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest
          only-severities: critical,high   # will cause non‑zero exit if such CVEs exist

     # 5. Generae SBOM with Docker Scout 
      - name: Generate SBOM
        uses: docker/scout-action@v1
        with:
          command: sbom
          image: ${{ steps.build.outputs.image }}
          output: sbom.json  # Save as JSON file
          format: cyclonedx-json  # Or spdx-json, syft-json

    # 6. Upload SBOM as artifact
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-todo-app-sbom
          path: sbom.json
          retention-days: 30

     # 7. Push Image (Only if the Scan is okay) 
      - name: Push image (only if scan OK)
        if: success()          # skips if Scout step failed
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest
