name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]
 

jobs:
  doker-build-scout-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read           # Checkout code
      security-events: write   # CodeQL + SARIF upload
      id-token: write          # Cosign OIDC signing
      actions: read            # Artifact download
      checks: write            # Check annotations

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

       # 2. SonarQube SAST (fail early on code issues)
      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v3  
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.SONAR_ORG_KEY }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=false

      # 3. CodeQL Analysis (SAST + deps)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python  

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
          
      # 4. Setup Python + pytest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  

      - name: Dependency scanning (pip-audit)
        run: |
          pipx install pip-audit
          pip-audit requirements.txt --fail
        continue-on-error: true  # Don't block pipeline on warnings

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main

      - name: Install dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
          pytest --cov=. --cov-report=xml

      # 5. Build Docker Image
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest

     # 6. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Scan locally with Docker Scout and FAIL on critical/high
      - name: Scan for CVEs with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest
          only-severities: critical,high   # will cause non‑zero exit if such CVEs exist

     # 8. Generae SBOM with Docker Scout 
      - name: Generate SBOM
        uses: docker/scout-action@v1
        with:
          command: sbom
          image: ${{ steps.build.outputs.image }}
          output: sbom.json  # Save as JSON file
          format: spdx  # Or spdx, json, list

      - name: Sign image with Cosign (OIDC)
        if: success()
        uses: sigstore/cosign-installer@v3.1.2  # Fixed version
        env:
          COSIGN_EXPERIMENTAL: "true"
      - name: Sign and push
        run: |
          cosign sign --yes \
             ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest

    # 9. Upload SBOM as artifact
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-todo-app-sbom
          path: sbom.json
          retention-days: 30

     # 10. Push Image (Only if the Scan is okay) 
      - name: Push image (only if scan OK)
        id: push-and-sign
        if: success()          # skips if Scout step failed
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest

     # 11. Sign PUSHED image with digest
      - name: Sign pushed image
        if: success()
        run: |
          cosign sign --yes \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest

      # 12. Verify signature
      - name: Verify cosign signature
        run: |
          cosign verify \
            ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest \
            continue-on-error: true

