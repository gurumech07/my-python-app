name: Build and Push to Docker Hub

on:
  push:
    branches: [ main ]
 

jobs:
  doker-build-scout-push:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

       # 2. SonarQube SAST (fail early on code issues)
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # 3. CodeQL Analysis (SAST + deps)
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: python  # Add java, javascript if needed

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
          
      # 4. Setup Python + pytest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  

      - name: Install pip-audit & scan dependencies
        run: |
          pipx install pip-audit
          pip-audit requirements.txt --fail-on critical

      - name: Secret scanning (TruffleHog)
        uses: trufflesecurity/trufflehog@main

      - name: Install dependencies & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-cov
          pytest --cov=. --cov-report=xml

      # 5. Build Docker Image
      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest

     # 6. Login to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 7. Scan locally with Docker Scout and FAIL on critical/high
      - name: Scan for CVEs with Docker Scout
        uses: docker/scout-action@v1
        with:
          command: cves
          image: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest
          only-severities: critical,high   # will cause non‑zero exit if such CVEs exist

     # 8. Generae SBOM with Docker Scout 
      - name: Generate SBOM
        uses: docker/scout-action@v1
        with:
          command: sbom
          image: ${{ steps.build.outputs.image }}
          output: sbom.json  # Save as JSON file
          format: spdx  # Or spdx, json, list

      - name: Sign image with Cosign (OIDC)
        if: success()
        uses: sigstore/cosign-installer@v3.1.2  # Fixed version
        env:
          COSIGN_EXPERIMENTAL: "true"
      - name: Sign and push
        run: |
          cosign sign --yes \
            ${{ steps.build.outputs.image }}@${{ steps.build.outputs.digest }}

    # 9. Upload SBOM as artifact
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-todo-app-sbom
          path: sbom.json
          retention-days: 30

     # 10. Push Image (Only if the Scan is okay) 
      - name: Push image (only if scan OK)
        if: success()          # skips if Scout step failed
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/my-todo-app:latest
